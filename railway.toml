# https://docs.railway.com/guides/config-as-code
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# El ENTRYPOINT del Dockerfile genera nginx en $PORT y arranca php-fpm + nginx.
# En el dashboard, Start Command y Pre-deploy Command deben estar VACÍOS.
# Si queda `npm run start`, Railway saltea el ENTRYPOINT y /up falla.
releaseCommand = "bash scripts/railway-db-setup.sh"
healthcheckPath = "/up"
healthcheckTimeout = 120
